controllers:
  joint_state_controller:
    type: joint_state_controller/JointStateController
    publish_rate: 100
  robot_state_controller:
    type: robot_state_controller/RobotStateController
    publish_rate: 100

  orientation_controller:
    type: rm_orientation_controller/Controller
    publish_rate: 100
    name: "gimbal_imu"
    frame_source: "odom"
    frame_target: "base_link"

  gimbal_controller:
    type: rm_gimbal_controllers/Controller

    track_solver_type: "bullet_solver"       # bullet_solver | external_aim | external_mpc_aim
    external_aim_topic: "/sp_vision/gimbal_aim"
    external_mpc_aim_topic: "/sp_vision/mpc_gimbal_aim"
    external_aim_timeout: 0.1

    controllers:
      yaw:
        joint: "yaw_joint"
        pid: { p: 0.7, i: 22, d: 0.0, i_clamp_max: 0.2, i_clamp_min: -0.2, antiwindup: true, publish_state: false }
        pid_pos: { p: 14.0, i: 0, d: 0.0, i_max: 0.0, i_min: 0.0, antiwindup: true, publish_state: false }
        chassis_comp_a: 0.0015
        chassis_comp_b: 0.0
        chassis_comp_c: 0.0
        chassis_comp_d: 0.0
        k_v: 1.0
        accel: 28.0
      pitch:
        joint: "pitch_joint"
        #2/28 p from 0.45 to 0.5 and i form 7 to 10 is all accaptable
        pid: { p: 0.6, i: 18, d: 0.0, i_clamp_max: 0.2, i_clamp_min: -0.2, antiwindup: true, publish_state: true }
        pid_pos: { p: 24.0, i: 0, d: 0.0, i_max: 0.0, i_min: 0.0, antiwindup: true, publish_state: true }
        k_v: 1.0
        accel: 40.0
    delay: 0.03
    chassis_vel:
      num_data: 30
      debug: true
    imu_name: "gimbal_imu"
    feedforward:
      gravity: 14.5
      enable_gravity_compensation: false
      mass_origin: [ -0.014495,0.024,0.048 ]
    bullet_solver:
      resistance_coff_qd_10: 0.001
      resistance_coff_qd_15: 0.001
      resistance_coff_qd_16: 0.001
      resistance_coff_qd_18: 0.001
      resistance_coff_qd_30: 0.001
      g: 9.81
      delay: 0.05
      dt: 0.001
      timeout: 0.5
      publish_rate: 50
      center_delay: 0.092
      switch_angle_offset: 0.7
      max_track_target_vel: 10.0
      switch_hysteresis: 1.0
      max_chassis_angular_vel: 12.0
      track_rotate_target_delay: 0.0
      track_move_target_delay: 0.2
      track_rotate_outpost_delay: 0.0

  gimbal_calibration_controller:
    type: rm_calibration_controllers/MechanicalCalibrationController
    actuator: [ pitch_joint_motor ]
    velocity:
      joint: pitch_joint
      search_velocity: 6.28
      vel_threshold: 1e-2
      pid: { p: 0.3, i: 0, d: 0.0, i_clamp_max: 0.0, i_clamp_min: 0.0, antiwindup: true }

  trigger_calibration_controller:
    type: rm_calibration_controllers/MechanicalCalibrationController
    actuator: [ trigger_joint_motor ]
    velocity:
      joint: trigger_joint
      search_velocity: 3.1415
      vel_threshold: 0.1
      pid: { p: 0.4, i: 0, d: 0.0, i_clamp_max: 0.0, i_clamp_min: 0.0, antiwindup: true }

  shooter_controller:
    type: rm_shooter_controllers/Controller
    publish_rate: 50
    friction:
      friction_right:
        right_friction_wheel:
          joint: "right_friction_wheel_joint"
          pid: { p: 0.0007, i: 0.005, d: 0.0, i_clamp_max: 0.01, i_clamp_min: -0.01, antiwindup: true, publish_state: false }
          wheel_speed_direction: -1.0
      friction_left:
        left_friction_wheel:
          joint: "left_friction_wheel_joint"
          pid: { p: 0.0007, i: 0.005, d: 0.0, i_clamp_max: 0.01, i_clamp_min: -0.01, antiwindup: true, publish_state: false }
          wheel_speed_direction: 1.0
    trigger:
      joint: "trigger_joint"
      pid: { p: 36.0, i: 0.0, d: 0.5, i_clamp_max: 0.0, i_clamp_min: 0.0, antiwindup: true, publish_state: false }
    push_per_rotation: 8
    push_qd_threshold: 0.90
    block_effort: 4.2
    block_speed: 0.1
    block_duration: 0.1
    block_overtime: 0.5
    anti_block_angle: 0.20
    anti_block_threshold: 0.1
    forward_push_threshold: 0.28
    exit_push_threshold: 0.3
    wheel_speed_drop_threshold: 3.8
    wheel_speed_raise_threshold: 0.7
    freq_threshold: 15.0

  chassis_controller:
    normal_reference:
      position_release_tau: 0.20 # Velocity/braking: release the previous position error, seconds.
      hold_capture_speed: 0.10 # Capture a fixed S reference after source/ramp/Vref all reach zero, m/s.
      length_tau: 0.20 # Retained for compatibility; second-order length shaping is inactive.
    velocity_estimator:
      velocity_process_density: 0.02 # Velocity diffusion q_v, m^2/s^3; Qvv += q_v*dt.
      jerk_density: 10.0 # White jerk spectral density, m^2/s^5.
      velocity_stddev: 0.03 # Scalar IMU-heading velocity observation standard deviation, m/s.
      acceleration_stddev: 0.5 # Heading-velocity derivative observation standard deviation, m/s^2.
      velocity_filter_tau: 0.002 # Matched velocity-observation / point-compensation IIR, s.
      acceleration_filter_tau: 0.001 # Acceleration-observation IIR, s.
      velocity_residual_threshold: 0.12 # Pre-update velocity innovation, m/s.
      velocity_noise_multiplier: 1.0 # Fixed observation variance; stretch residual alone does not establish wheel slip.
    type: rm_chassis_controllers/BipedalController
    # ChassisBase
    publish_rate: 100
    enable_odom_tf: true
    publish_odom_tf: true
    power:
      effort_coeff: 1.339
      vel_coeff: 0.016
      power_offset: 0
    twist_angular: 0.5233
    max_odom_vel: 10.0
    timeout: 0.1
    raw_yaw_feedforward_k: -0.15
    pid_follow: { p: 1.75, i: 0, d: 0.3, i_max: 0.0, i_min: 0.0, antiwindup: true, publish_state: true }
    pid_block_error: { p: 0, i: 0, d: 0.0, i_max: 0.0, i_min: 0.0, antiwindup: true, publish_state: true }
    twist_covariance_diagonal: [ 0.001, 0.001, 0.001, 0.001, 0.001, 0.001 ]

    # BipedalController
    pid_theta_diff: {p: 400.0, i: 0.0, d: 3.5, i_max: 0.0, i_min: 0.0, antiwindup: true, publish_state: true}
    pid_yaw_vel: {p: 0.7, i: 4.0, d: 0.0, i_clamp_max: 1.5, i_clamp_min: -1.5, antiwindup: true, publish_state: true}
    pid_wheel_vel_diff: {p: 0.25, i: 0.0, d: 0.0, i_clamp_max: 0.1, i_clamp_min: -0.1, antiwindup: true, publish_state: true}
    recovery_leg_speed: 5.0  # Original Recover mechanical target, rad/s.
    jumpOverTime: 2.0
    jump_up_force: 210.0
    off_ground_force: 90.0
    down5cmStairPitchThreshold: 0.1
    down5cmStairThetaThreshold: 0.2
    pid_left_leg: { p: 1000.0, i: 100., d: 60.0, i_clamp_max: 10.0, i_clamp_min: -10.0, antiwindup: true, publish_state: true }
    pid_right_leg: { p: 1000.0, i: 100., d: 60.0, i_clamp_max: 10.0, i_clamp_min: -10.0, antiwindup: true, publish_state: true }
    pid_roll: { p: 1500.0, i: 0, d: 35., i_clamp_max: 30.0, i_clamp_min: -30.0, antiwindup: true, publish_state: true }
    pid_left_leg_theta: { p: 45.0, i: 0., d: 5., i_clamp_max: 2.0, i_clamp_min: -2.0, antiwindup: true, publish_state: true }
    pid_right_leg_theta: { p: 45.0, i: 0., d: 5., i_clamp_max: 2.0, i_clamp_min: -2.0, antiwindup: true, publish_state: true }
    pid_left_leg_theta_vel: { p: 6.0, i: 3.0, d: 0., i_clamp_max: 10.0, i_clamp_min: -10.0, antiwindup: true, publish_state: true }
    pid_right_leg_theta_vel: { p: 6.0, i: 3.0, d: 0., i_clamp_max: 10.0, i_clamp_min: -10.0, antiwindup: true, publish_state: true }
    pid_left_wheel_vel: { p: 0.35, i: 0.0, d: 0.0, i_clamp_max: 0.01, i_clamp_min: -0.01, antiwindup: true, publish_state: true }
    pid_right_wheel_vel: { p: 0.35, i: 0.0, d: 0.0, i_clamp_max: 0.01, i_clamp_min: -0.01, antiwindup: true, publish_state: true }

    pid_left_leg_stand_up: { p: 800.0, i: 0.0, d: 35.0, i_clamp_max: 20.0, i_clamp_min: -20.0, antiwindup: true, publish_state: true }
    pid_right_leg_stand_up: { p: 800.0, i: 0.0, d: 35.0, i_clamp_max: 20.0, i_clamp_min: -20.0, antiwindup: true, publish_state: true }

    spring_s2: 0.0486
    spring_s3: 0.20
    spring_alpha_s: 0.2448
    # Physical parameters for the spring system
    gravity_force: 110
    spring_force: 250
    # use in gazebo
    # gravity_force: 87.54
    # spring_force: 0
    default_leg_length: 0.12

    unstick_threshold: 5
    # VMC config
    l1: 0.21
    l2: 0.248

    # X10: s,v,yaw,yaw_rate,theta_L,dtheta_L,theta_R,dtheta_R,+pitch,pitch_rate.
    # U4: Tw_L,Tw_R,Tp_L,Tp_R (Nm). setupLQR() generates the complete table from these weights.
    q: [120.0, 225.0, 320.0, 32.0, 450.0, 12.0, 450.0, 12.0, 90000.0, 30.0] # V2 C2; regenerate the full K table.
    r: [400, 400, 7.5, 7.5]

    # Current series_legged Gazebo development source. This is not hardware calibration.
    lqr10:
      length_domain: [0.06, 0.40]
      # period_range was removed by request; do not reintroduce it or its runtime/design gates.
      gate:
        max_angle: 0.2

    # Current series_legged Gazebo nominal equivalent model; not hardware calibration/certification.
    lqr_model:
      gravity: 9.8
      body:
        mass: 17.137
        pitch_inertia: 0.38
        com_distance: 0.0182
        com_angle: -0.219
      yaw_inertia: 0.5282
      wheel:
        mass: 0.80357
        spin_inertia: 0.00336
      # Shared mechanical parameters; each side is evaluated at its own measured VMC length.
      leg:
        mass: 0.8378
        # Rebased from [0.08, 0.36] to [0.06, 0.40]: t_old = (17*t_new + 1)/14.
        # Rounded to 8 decimal places after rebasing; the added range is extrapolation.
        angle_offset_coefficients:
        - 0.00781088
        - -0.00731481
        - 0.00274022
        - -0.00087926
        - 0.00038916
        - -0.00007942
        - 0.00005001
        - 0.00000000
        lb_coefficients:
        - 0.08640767
        - 0.05100648
        - 0.01027296
        - -0.00683328
        - 0.00347113
        - -0.00170093
        - 0.00053854
        - -0.00019618
        lw_coefficients:
        - 0.17427211
        - 0.07783741
        - 0.00898093
        - -0.00347784
        - 0.00124102
        - -0.00052677
        - 0.00014618
        - -0.00006539
        inertia_coefficients:
        - 0.01540610
        - -0.00059323
        - -0.00094531
        - 0.00026475
        - -0.00020695
        - 0.00004118
        - -0.00005001
        - 0.00000000

    # Effective mass retained only by the original axial turning compensation (kg).
    M: 12
    # 轮子半径
    wheel_radius: 0.06
    # 轮距
    wheel_track: 0.446
    # 底盘高度
    chassis_high: 0.115

    # under_lower_threshold: -M_PI / 2 + 0.7
    under_lower_threshold: -0.8708
    # under_upper_threshold: - 0.8
    under_upper_threshold: -0.8
    # front_lower_threshold: -M_PI / 2 + 0.7
    front_lower_threshold: -0.8708
    # front_upper_threshold: M_PI - 0.5
    front_upper_threshold: 2.6416
    # behind_lower_threshold: - 0.8
    behind_lower_threshold: -0.8
    # behind_upper_threshold: M_PI - 0.5
    behind_upper_threshold: 2.6416
    upstair_des_theta: 1.1
    #    upstair_des_length: 0.34
    upstair_des_length: 0.14
    upstair_exit_theta_threshold: 1.0
    upstair_exit_length_threshold: 0.24
    # upstair_des_theta: M_PI_2 - 0.6
    arrive_time_threshold: 1.5
    #    jump_up_force: 225
    #    off_ground_force: 150
